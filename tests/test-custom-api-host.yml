name: Test custom api-host and environment inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare environment
        run: |
          mkdir -p /home/runner/.config
          echo "HOME=$HOME"
          echo "USER=$(whoami)"

      - id: action
        uses: .
        with:
          client-id: my-client-id
          client-secret: my-client-secret
          api-host: https://chalk.mycompany.internal
          environment: staging

      - name: Assert chalk is on PATH
        run: |
          echo "Checking chalk is available on PATH..."
          if ! command -v chalk > /dev/null 2>&1; then
            echo "FAIL: chalk command not found on PATH"
            exit 1
          fi
          echo "PASS: chalk found at $(command -v chalk)"

      - name: Assert config file was written
        run: |
          CONFIG_FILE="/home/runner/.config/.chalk.yml"
          echo "Checking config file at $CONFIG_FILE..."
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: config file not found at $CONFIG_FILE"
            exit 1
          fi
          echo "Config contents:"
          cat "$CONFIG_FILE"
          echo "PASS: config file exists"

      - name: Assert custom api-host is in config
        run: |
          CONFIG_FILE="/home/runner/.config/.chalk.yml"
          if ! grep -q "https://chalk.mycompany.internal" "$CONFIG_FILE"; then
            echo "FAIL: custom api-host not found in config file"
            exit 1
          fi
          echo "PASS: custom api-host found in config"

      - name: Assert environment is in config
        run: |
          CONFIG_FILE="/home/runner/.config/.chalk.yml"
          if ! grep -q "staging" "$CONFIG_FILE"; then
            echo "FAIL: environment 'staging' not found in config file"
            exit 1
          fi
          echo "PASS: environment found in config"

      - name: Assert client credentials are in config
        run: |
          CONFIG_FILE="/home/runner/.config/.chalk.yml"
          if ! grep -q "my-client-id" "$CONFIG_FILE"; then
            echo "FAIL: client-id not found in config file"
            exit 1
          fi
          if ! grep -q "my-client-secret" "$CONFIG_FILE"; then
            echo "FAIL: client-secret not found in config file"
            exit 1
          fi
          echo "PASS: client credentials found in config"
