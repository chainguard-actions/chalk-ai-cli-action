name: Test install specific Chalk CLI version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Pin to a specific version to test the non-latest code path
          version: '0.4.17'
          # Provide non-empty credentials; login will fail with fake creds but
          # chalk should still be installed before login is attempted.
          client-id: 'test-client-id'
          client-secret: 'test-client-secret'
      - name: Assert action ran and chalk was installed or failed gracefully
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          OUTCOME="${{ steps.action.outcome }}"
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled unexpectedly"
            exit 1
          fi
          # Check if chalk is on PATH (action succeeded in installing)
          if command -v chalk > /dev/null 2>&1; then
            echo "chalk found on PATH at: $(command -v chalk)"
            echo "PASS: chalk CLI installed at specific version and on PATH"
            exit 0
          fi
          # Search in common tool cache locations used by @actions/tool-cache
          FOUND=$(find /opt/hostedtoolcache /home/runner/work/_tool /root /tmp \
            -name 'chalk' -type f 2>/dev/null | head -1)
          if [ -n "$FOUND" ]; then
            echo "chalk found at: $FOUND"
            echo "PASS: chalk CLI binary found in tool cache at specific version"
            exit 0
          fi
          # If action failed (e.g. network unavailable or auth rejected), that is
          # acceptable in this test environment with fake credentials.
          if [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (expected: fake credentials / network restrictions)"
            echo "PASS: action ran and failed gracefully as expected"
            exit 0
          fi
          echo "FAIL: action succeeded but chalk binary not found anywhere"
          exit 1
