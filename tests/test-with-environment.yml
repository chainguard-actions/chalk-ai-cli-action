name: Test Chalk CLI with environment and api-host inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          client-id: test-client-id
          client-secret: test-client-secret
          environment: staging
          api-host: https://api.chalk.ai
        continue-on-error: true
      - name: Assert action ran with environment inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to invalid credentials, but it should at least attempt to run
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome: $OUTCOME"
